name: Node.js CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Project-7-CICD-NodeJS/package-lock.json

      - name: Install dependencies
        working-directory: Project-7-CICD-NodeJS
        run: npm ci

      - name: Run tests
        working-directory: Project-7-CICD-NodeJS
        run: npm test
