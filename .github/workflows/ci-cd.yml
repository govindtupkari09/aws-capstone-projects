name: Node.js CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Project-4-CICD-NodeJS/package-lock.json

      - name: Install dependencies
        working-directory: Project-4-CICD-NodeJS
        run: npm ci

      - name: Run tests
        working-directory: Project-4-CICD-NodeJS
        run: npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Deploy application to EC2
        run: |
          set -e

          cd ~/aws-capstone-projects

          git fetch origin
          git reset --hard origin/main

          if [ -d Project-4-CICD-NodeJS ]; then
            cd Project-4-CICD-NodeJS
          else
            cd Project-7-CICD-NodeJS
          fi

          npm ci
          npm test

          pm2 delete project-7-cicd || true
          pm2 start index.js --name project-7-cicd
          pm2 save

          sleep 3

          curl --retry 5 --retry-delay 2 --retry-connrefused -f http://localhost:3000/health
